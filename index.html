<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Explore Akash Kumar's travel timeline, destination photo galleries, and travel reels from Accelerate Clicks.">
    <meta name="theme-color" content="#070b14">
    <link rel="canonical" href="https://akashkr101.github.io/akash-links/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:title" content="Akash Kumar | Accelerate Clicks">
    <meta property="og:description"
        content="Travel, photography, and stories from Akash Kumar. Explore destination galleries and travel reels.">
    <meta property="og:url" content="https://akashkr101.github.io/akash-links/">
    <meta property="og:image"
        content="https://akashkr101.github.io/akash-links/images/2026-banaras/20251125_183647.jpg">
    <meta property="og:image:alt" content="Travel photo from Akash Kumar's journey">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Akash Kumar | Accelerate Clicks">
    <meta name="twitter:description"
        content="Travel, photography, and stories from Akash Kumar. Explore destination galleries and travel reels.">
    <meta name="twitter:image"
        content="https://akashkr101.github.io/akash-links/images/2026-banaras/20251125_183647.jpg">

    <title>Akash Kumar | Accelerate Clicks — Travel &amp; Photography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <a class="skip-link" href="#journeyContainer">Skip to travel timeline</a>

    <!-- HERO SECTION -->

    <header class="hero">

        <div class="hero-overlay">

            <img id="profileImage" class="profile-image" alt="Portrait of Akash Kumar" fetchpriority="high">

            <h1 id="name"></h1>

            <p id="tagline"></p>

            <h3 class="social-title">
                Find Me Online
            </h3>

            <div id="socials" class="socials"></div>

            <a href="#journeyContainer" class="explore-btn">
                Explore My Journey
            </a>

        </div>

    </header>

    <!-- STATS -->

    <main>

        <section class="stats" aria-label="Travel statistics">

            <div class="stat-card">

                <h2 id="yearCount">0</h2>

                <p>Years</p>

            </div>

            <div class="stat-card">

                <h2 id="destinationCount">0</h2>

                <p>Destinations</p>

            </div>

        </section>

        <!-- TIMELINE -->

        <section id="journeyContainer" aria-labelledby="journeyTitle">

            <h2 id="journeyTitle" class="section-title">
                Travel Timeline
            </h2>

            <!-- Generated dynamically from data.js -->

        </section>

        <!-- BUCKET LIST -->

        <section class="bucket" aria-labelledby="bucketTitle">

            <h2 id="bucketTitle" class="section-title">
                Upcoming Adventures
            </h2>

            <ul id="bucketList"></ul>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>

        <p>
            © <span id="currentYear"></span> Accelerate Clicks | Travel • Photography • Stories
        </p>

    </footer>

    <!-- DESTINATION MODAL -->

    <div id="destinationModal" class="modal" role="dialog" aria-modal="true"
        aria-labelledby="modalTitle" aria-hidden="true" tabindex="-1">

        <button id="modalClose" class="close" type="button" aria-label="Close destination details">
            &times;
        </button>

        <div id="modalContent"></div>

    </div>

    <!-- IMAGE LIGHTBOX -->

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true"
        aria-label="Photo viewer" aria-hidden="true" tabindex="-1">

        <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Close photo viewer">
            &times;
        </button>

        <button id="lightboxPrevious" class="lightbox-nav lightbox-previous" type="button"
            aria-label="Previous photo">
            &#10094;
        </button>

        <figure class="lightbox-figure">
            <img id="lightboxImg" alt="">
            <figcaption id="lightboxCaption"></figcaption>
        </figure>

        <button id="lightboxNext" class="lightbox-nav lightbox-next" type="button"
            aria-label="Next photo">
            &#10095;
        </button>

    </div>

    <!-- DATA -->

    <script src="data.js"></script>

    <!-- LOGIC -->

    <script src="script.js"></script>

</body>

</html>
